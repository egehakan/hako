[package]
name = "hako_remote"
version = "0.1.0"
edition = "2024"
description = "Protocol types and the relay connection for controlling Hako from a browser"
publish.workspace = true
license.workspace = true

[dependencies]
async-channel.workspace = true
async-process.workspace = true
async-tungstenite = { version = "0.28.2", features = ["tokio-rustls-manual-roots"] }
base64.workspace = true
chrono.workspace = true
command.workspace = true
futures.workspace = true
libc.workspace = true
log.workspace = true
rustls.workspace = true
rustls-platform-verifier = "0.7.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
url.workspace = true
zip = "2.1"

[dev-dependencies]
tempfile.workspace = true
